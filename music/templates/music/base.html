{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ladida</title>
  <script>
    // Follow the theme chosen in the Django admin (localStorage "theme": auto/light/dark).
    (() => {
      const t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="{% static 'music/app.css' %}">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <header class="container">
    <nav>
      <ul><li><a href="{% url 'music:song_list' %}"><strong>ladida</strong></a></li></ul>
      <ul>
        <li><a href="{% url 'music:song_list' %}">Songs</a></li>
        <li><a href="{% url 'music:collection_list' %}">Collections</a></li>
        <li><a href="{% url 'music:import_page' %}">Import</a></li>
        <li>
          <a href="{% url 'admin:index' %}" class="nav-icon" aria-label="Admin" title="Admin">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </a>
        </li>
      </ul>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("{% url 'music:service_worker' %}");
      addEventListener("load", () => {
        const urls = [
          location.href,
          ...[...document.querySelectorAll("link[rel=stylesheet][href]")].map((l) => l.href),
          ...[...document.querySelectorAll("script[src]")].map((s) => s.src),
          ...[...document.images].filter((i) => i.complete && i.currentSrc).map((i) => i.currentSrc),
        ];
        navigator.serviceWorker.ready.then((r) => r.active?.postMessage({ type: "precache", urls }));
      });
    }
    // Only one player at a time.
    document.addEventListener("play", (e) => {
      document.querySelectorAll("audio").forEach((a) => a !== e.target && a.pause());
      // Store played songs for offline playback.
      const url = e.target.currentSrc;
      if (url && "serviceWorker" in navigator) {
        navigator.serviceWorker.ready.then((r) => r.active?.postMessage({ type: "cache-media", url }));
      }
    }, true);
    document.addEventListener("htmx:afterSwap", (e) => {
      if (e.detail.target.tagName === "DIALOG" && !e.detail.target.open) e.detail.target.showModal();
    });
    document.addEventListener("close", (e) => {
      e.target.querySelectorAll?.("audio").forEach((a) => a.pause());
    }, true);
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
