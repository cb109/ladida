{% extends "music/base.html" %}

{% block content %}
<div class="page-header">
  <h2>Collections</h2>
  <a href="{% url 'music:collection_create' %}" role="button">New collection</a>
</div>
<table>
  <thead><tr><th>Name</th><th></th></tr></thead>
  <tbody>
  {% for c in collections %}
    <tr>
      <td><a href="{% url 'music:song_list' %}?collection={{ c.pk }}">{{ c.name }} ({{ c.song_count }})</a></td>
      <td class="row-actions">
        <a href="{% url 'music:collection_player' c.pk %}">Play</a>
        &middot;
        <a href="{% url 'music:collection_edit' c.pk %}">Edit</a>
        &middot;
        <a href="{% url 'music:collection_delete' c.pk %}">Delete</a>
      </td>
    </tr>
  {% empty %}
    <tr><td colspan="2">No collections yet.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
